[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemio"
version = "0.2.0"
description = "Gemio: AI Assistant & Sandbox-Ready Development Agent Library and TUI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "koyama-hiro-15" },
]
requires-python = ">=3.11"
keywords = [
    "ai",
    "agent",
    "gemini",
    "cli",
    "sandbox",
    "docker",
    "devcontainer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "google-genai",
    "rich",
    "textual",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/koyama-hiro-15/gemio"
Repository = "https://github.com/koyama-hiro-15/gemio"
Changelog = "https://github.com/koyama-hiro-15/gemio/blob/main/CHANGELOG.md"
Issues = "https://github.com/koyama-hiro-15/gemio/issues"

[project.scripts]
gemio = "gemio.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
